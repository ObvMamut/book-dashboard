[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-dashboard"
version = "0.1.0"
description = "Terminal dashboard for downloading viewer pages and rendering a local PDF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ObvMamut" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "playwright>=1.50", "textual>=6"]

[project.optional-dependencies]
dev = ["ruff>=0.12", "pypdf>=5"]

[project.scripts]
book-dashboard = "book_dashboard.tui:main"

[tool.setuptools.packages.find]
include = ["book_dashboard*"]

[tool.setuptools.package-data]
"book_dashboard.reconstruction" = ["templates/*.latex"]

[tool.ruff]
line-length = 100
extend-exclude = [".envv", ".recon-env"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
